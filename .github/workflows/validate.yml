name: Validate open hardware package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify original files and documentation links
        run: python scripts/validate.py
      - name: Build reproducible distribution
        run: python scripts/make_release.py
